      description: >-
        The time the alarm rings. The picker sends a 24-hour time; seconds are
        ignored.
      required: true
      example: "07:30"
      selector:
        time:
    label:
      name: Alarm name
      description: >-
        Name shown in the app, and the name of the alarm's Home Assistant
        device. Defaults to "Alarm".
      required: false
      example: Weekday Wake
      selector:
        text:
    enabled:
