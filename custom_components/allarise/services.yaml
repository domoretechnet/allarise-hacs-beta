        out and the steps are worked out from the fields you did set — Notes
        text gives a Notes page, Morning weather gives the weather card, a
        Dismiss app link gives the open-app step. The visual editor sends the
        steps in the order listed here; to control the order exactly, write the
        list in YAML. Open app is always forced last. Sent together with Verse
        of the Day or Morning weather, the list is applied first and the toggle
        then adjusts that one step.
      required: false
      example: '["notes", "verse", "weather"]'
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - value: notes
              label: Notes page
            - value: verse
              label: Verse of the Day
            - value: weather
              label: Morning weather
            - value: appLink
              label: Open app link
    dismiss_app_uri:
      name: Dismiss app link
      description: >-
        The phone opens this link right after the alarm is fully dismissed — a
        Shortcuts URL, for example. Send an empty string to clear it.
      required: false
      example: shortcuts://run-shortcut?name=Morning
      selector:
        text:
    snooze_app_uri:
      name: Snooze app link
      description: >-
        The phone opens this link each time the alarm is snoozed. Send an empty
        string to clear it.
      required: false
      example: shortcuts://run-shortcut?name=Five%20More
      selector:
        text:
    swipe_left_command:
      name: Swipe left command
      description: >-
        Name of the command to run when swiping left on the alarm screen in the
        app. The list offers the commands this Home Assistant has seen the
        phone report; one created moments ago may not be there yet, so any name
        can still be typed.
      required: false
      example: Kitchen Lights
      selector:
        text:
    swipe_right_command:
      name: Swipe right command
      description: >-
        Name of the command to run when swiping right on the alarm screen in
        the app. The list offers the commands this Home Assistant has seen the
        phone report; one created moments ago may not be there yet, so any name
        can still be typed.
      required: false
      example: Open Door
      selector:
        text:
    radio_station:
      name: Radio station
      description: >-
        Wake-up radio station. The list is the phone's favourited stations as
        it last reported them; a name or UUID can also be typed, matched
        ignoring case and surrounding spaces. Requires App Persistence on the
        phone — without it the alarm rings with its tone instead. (For an
        arbitrary stream URL, publish radio_station as an object via MQTT
        directly.)
      required: false
      selector:
        text:
    ephemeral:
      name: One-shot
      description: >-
        A one-shot alarm is kept out of the phone's normal alarm list and is
        deleted automatically once it fires. It also gets no per-alarm Home
        Assistant entities, so there is nothing left behind to clean up. Tick
        the field to include it in the call, then use the toggle to set it.
      required: false
      selector:
        boolean:
    mqtt_id:
      name: MQTT ID
      description: >-
        Your own stable identifier for this alarm, stored alongside it. Useful
        for finding an alarm you created from an automation later. This is NOT
        the Alarm ID that Update alarm and Delete alarm target — the app assigns
        that itself.
      required: false
      example: ha_alarm_morning
      selector:
        text:

delete_alarm:
  name: Delete alarm
  description: >-
    Delete an alarm from the phone. Target it by Alarm ID or by name — provide
    exactly one.
  fields:
    device_name:
      name: Device
      description: Which Allarise device. Omit when only one is configured.
      required: false
      selector:
        text:
    index:
      name: Alarm ID
      description: >-
        Which alarm to delete. The list offers the alarms this device has
        published, as "3 — Weekday Wake"; the value sent is the number. It is
        the alarm's MQTT ID, also held by every alarm device's "Alarm ID"
        sensor, shown in the app as "MQTT Alarm Index" at the bottom of the
        alarm's edit screen, and used in that alarm's entity IDs
        (sensor.allarise_..._alarm_3_state → 3). It is assigned when the alarm
        is created and does not change when the alarm is renamed.
      required: false
      example: 3
      selector:
        number:
          min: 1
          mode: box
    name:
      name: Name
      description: >-
        Alarm name, case-insensitive. Use this instead of the Alarm ID. The
        list offers the alarms this device has published; any name can still be
        typed.
      required: false
      example: Weekday Wake
      selector:
        text:

create_command:
  name: Create command
  description: >-
    Create or update a custom command button on the phone. Creating a command
    that already exists updates it in place.
  fields:
    device_name:
      name: Device
      description: Which Allarise device. Omit when only one is configured.
      required: false
      selector:
        text:
    name:
      name: Name
      description: >-
        Command name. Also the key used to update or delete it later, and the
        name you reference from an alarm's swipe and Notes page buttons. Leading
        and trailing spaces are trimmed before sending, so a name pasted with a
        stray space still matches the command you meant.
      required: true
      example: Kitchen Lights
      selector:
        text:
    icon:
      name: Icon
      description: >-
        SF Symbol name for the button's icon, e.g. lightbulb.fill. Any SF Symbol
        works; one this iOS version does not know renders as nothing. Browse the
        names at https://developer.apple.com/sf-symbols/
      required: false
      example: lightbulb.fill
      selector:
        text:
    color:
      name: Icon colour
      description: >-
        Colour of the button's ICON — the button itself is not tinted. Pick a
        preset, or use Custom icon colour below for anything else.
      required: false
      example: Blue
      selector:
        select:
          custom_value: true
          options:
            - Blue
            - Red
            - Green
            - Orange
            - Purple
            - Pink
            - Teal
            - Yellow
            - Indigo
            - Mint
            - Brown
            - Gray
            - Sky Blue
            - Cyan
            - Navy
            - Midnight
            - Sea Green
            - Forest
            - Lime
            - Olive
            - Amber
            - Gold
            - Peach
            - Coral
            - Copper
            - Sand
            - Crimson
            - Maroon
            - Rose
            - Magenta
            - Lavender
            - Violet
            - Plum
            - Slate
            - Steel
            - Charcoal
    color_rgb:
      name: Custom icon colour
      description: >-
        An exact colour for the ICON, chosen from the colour wheel. Overrides
        the preset above.
      required: false
      selector:
        color_rgb:
    arm_action:
      name: Arm action
      description: >-
        What running this command does to the app's arm state, on top of
        whatever the command itself triggers.
      required: false
      selector:
        select:
          custom_value: true
          options:
            - value: none
              label: No change
            - value: arm
              label: Arm
            - value: disarm
              label: Disarm
            - value: toggle
              label: Toggle
    show_in_list:
      name: Show in list
      description: >-
        Whether the command appears in the app's commands list. Turn it off for
        a command that only exists to be fired from an alarm screen or from Home
        Assistant. Tick the field to include it in the call, then use the toggle
        to set it.
      required: false
      selector:
        boolean:

delete_command:
  name: Delete command
  description: Delete a custom command button from the phone, by name.
  fields:
    device_name:
      name: Device
      description: Which Allarise device. Omit when only one is configured.
      required: false
      selector:
        text:
    name:
      name: Name
      description: >-
        Exact name of the command to delete, as shown in the app's commands
        list. Matching is case-sensitive. The list offers the commands this
        Home Assistant has seen the phone report; any name can still be typed.
      required: true
      example: Kitchen Lights
      selector:
        text:
