# Allarise services.
#
# Two rules govern every edit in this file.
#
# 1. A selector changes what the *UI produces*, never what the service
#    *accepts*. Every schema in __init__.py stays at least as permissive as it
#    was, so a YAML automation written against an older release keeps working
#    verbatim. That is why every dropdown here carries `custom_value: true`.
# 2. A field that is not listed here is still accepted — `missions`,
#    `mission_config`, `fade_in_duration` and the per-channel colour values are
#    all live API, just not shown in the visual editor. Hiding a field is a UI
#    decision; removing one would be a breaking change.

update_alarm:
  name: Update alarm
  description: >-
    Change an existing alarm on the phone. Only the fields you fill in are
    changed — everything else on the alarm is left alone.
  fields:
    device_name:
      name: Device
      description: Which Allarise device. Omit when only one is configured.
      required: false
      selector:
        text:
    index:
      name: Alarm ID
      description: >-
        Which alarm to change. This is the alarm's MQTT ID: every alarm's Home
        Assistant device has an "Alarm ID" sensor holding it, the app shows it
        as "MQTT Alarm Index" at the bottom of the alarm's edit screen, and it
        is the number in that alarm's entity IDs
        (sensor.allarise_..._alarm_3_state → 3). It is assigned when the alarm
        is created and does not change when the alarm is renamed.
      required: true
      example: 3
      selector:
        number:
          min: 1
          mode: box
    time:
      name: Time
      description: >-
        The time the alarm rings. The picker sends a 24-hour time; seconds are
        ignored.
      required: false
      example: "07:30"
      selector:
        time:
    label:
      name: Alarm name
      description: >-
        Renames the alarm. This is the display name only — the alarm is targeted
        by its Alarm ID above, so renaming never changes what an automation
        points at.
      required: false
      example: Weekday Wake
      selector:
        text:
    enabled:
      name: Enabled
      description: >-
        Arms or disarms the alarm. Tick the field to include it in the call,
        then use the toggle to set it. Left unticked, the alarm keeps its
        current setting.
      required: false
      selector:
        boolean:
    days:
      name: Days
      description: >-
        The days of the week this alarm repeats on. Choose none for a one-time
        alarm that fires once and then stops repeating. Day numbers (1=Sunday to
        7=Saturday) and a comma-separated list still work for automations
        written that way.
      required: false
      example: "[monday, tuesday, wednesday, thursday, friday]"
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - value: sunday
              label: Sunday
            - value: monday
              label: Monday
            - value: tuesday
              label: Tuesday
            - value: wednesday
              label: Wednesday
            - value: thursday
              label: Thursday
            - value: friday
              label: Friday
            - value: saturday
              label: Saturday
    sound:
      name: Sound
      description: >-
        Alarm tone name, exactly as it appears in the app's sound picker. Also
        the fallback tone when a radio station cannot be reached. The list is
        the phone's own tones, bundled and imported, as it last reported them —
        an older app reports none, and any name can still be typed.
      required: false
      example: Alarm_Clock
      selector:
        text:
    volume:
      name: Volume
      description: How loud this alarm rings, as a percentage of full volume.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    vibrate:
      name: Vibrate
      description: >-
        Vibrate while the alarm rings. Tick the field to include it in the call,
        then use the toggle to set it. Left unticked, the alarm keeps its
        current setting.
      required: false
      selector:
        boolean:
    fade_in:
      name: Fade in
      description: >-
        Minutes to ramp the volume up over when the alarm starts. 0 turns
        fade-in off. The app's own range is 1-15 minutes.
      required: false
      selector:
        number:
          min: 0
          max: 15
          step: 1
          unit_of_measurement: min
    snooze_interval:
      name: Snooze
      description: How long each snooze lasts, in minutes.
      required: false
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min
    snooze_limit:
      name: Max snoozes
      description: >-
        How many times this alarm can be snoozed before it must be dismissed. 0
        means snoozing is not allowed.
      required: false
      selector:
        number:
          min: 0
          max: 99
          step: 1
          mode: box
    snooze_mode:
      name: Snooze mode
      description: >-
        How the alarm is snoozed: tap the snooze button, hold it, wait for Home
        Assistant to send a snooze, or no snoozing at all.
      required: false
      selector:
        select:
          custom_value: true
          options:
            - value: tap
              label: Tap
            - value: hold
              label: Hold
            - value: home_assistant
              label: Home Assistant
            - value: disabled
              label: Disabled
    snooze_hold_duration:
      name: Snooze hold duration
      description: >-
        Seconds the snooze button must be held down. Only used when Snooze mode
        is Hold.
      required: false
      example: 2
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.5
          unit_of_measurement: s
          mode: box
    skip_mode:
      name: Skip mode
      description: >-
        How the next occurrence of this alarm is skipped from the app: tap,
        hold, or not at all.
      required: false
      selector:
        select:
          custom_value: true
          options:
            - value: tap
              label: Tap
            - value: hold
              label: Hold
            - value: disabled
              label: Disabled
    skip_hold_duration:
      name: Skip hold duration
      description: >-
        Seconds the skip control must be held down. Only used when Skip mode is
        Hold.
      required: false
      example: 2
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.5
          unit_of_measurement: s
          mode: box
    mission:
      name: Mission
      description: >-
        The wake-up challenge that must be completed before the alarm can be
        dismissed. Setting this replaces the alarm's FIRST mission AND CLEARS
        any others it has. Multi-mission sequences are still available — send
        the `missions` key in YAML, or build the payload with the MQTT builder.
      required: false
      selector:
        select:
          custom_value: true
          options:
            - value: none
              label: Tap (no challenge)
            - value: shake
              label: Shake
            - value: math
              label: Math
            - value: balance_ball
              label: Balance Ball
            - value: block_drop
              label: Block Drop
            - value: meteor
              label: Meteor Defense
            - value: home_assistant
              label: Home Assistant
    mission_difficulty:
      name: Mission difficulty
      description: >-
        How hard the mission above is. Set the Mission field in the same call —
        difficulty on its own cannot be applied, because changing the mission is
        what would clear the alarm's other missions. "Super easy" is a Math-only
        level; other missions use Easy instead. Shake has no difficulty, so this
        sets its shake intensity (light / medium / vigorous).
      required: false
      selector:
        select:
          custom_value: true
          options:
            - value: super_easy
              label: Super easy (Math only)
            - value: easy
              label: Easy
            - value: medium
              label: Medium
            - value: hard
              label: Hard
    notes:
      name: Notes
      description: >-
        Replaces the after-alarm Notes page text. Line breaks are preserved.
        The matching Home Assistant sensor shows the first 255 characters —
        anything longer is in its full_value attribute, because that is the
        longest state Home Assistant will hold.
      required: false
      selector:
        text:
          multiline: true
    append_notes:
      name: Append notes
      description: >-
        Adds a line to the Notes page instead of replacing it. Prefixed with
        "HA:" and separated from existing text by a divider. If the Notes page is
        on screen when this arrives, it updates live.
      required: false
      selector:
        text:
          multiline: true
    alarm_screen_commands:
      name: Notes page commands
      description: >-
        Up to 4 command names to show as buttons on the after-alarm Notes page.
        Send an empty list to clear them. A name that matches no saved command
        is skipped rather than failing the whole call. Once this Home Assistant
        has seen the phone report its commands, this becomes a picker; until
        then it is a plain list you can type into.
      required: false
      example: '["Open Door", "Kitchen Lights"]'
      selector:
        object:
    morning_weather:
      name: Morning weather
      description: >-
        Show the Good Morning weather card after this alarm is dismissed. Tick
        the field to include it in the call, then use the toggle to set it. Left
        unticked, the alarm keeps its current setting.
      required: false
      selector:
        boolean:
    verse_of_day:
      name: Verse of the Day
      description: >-
        Show the Verse of the Day card after this alarm is dismissed. Tick the
        field to include it in the call, then use the toggle to set it. Left
        unticked, the alarm keeps its current setting. This is the only way to
        switch the Verse step on, because unlike Notes, Weather and the app link
        it has no content of its own. Needs an app from 2026-07-28 or later; an
        older app ignores it silently — the alarm is still updated, just without
        the verse step.
      required: false
      selector:
        boolean:
    after_alarm_actions:
      name: After-alarm steps
      description: >-
        The steps that run once the alarm is fully dismissed, in order. Leave it
        out and nothing changes: Notes, Weather and the app link are already
        implied by their own fields, so an automation that never sets this keeps
        behaving exactly as it always did. The visual editor sends the steps in
        the order listed here — to control the order exactly, write the list in
        YAML. Open app is always forced last. Choosing none sends an empty list,
        which clears the explicit order; the steps that have content are still
        derived from it, so only Verse actually disappears. Sent together with
        Verse of the Day or Morning weather, the list is applied first and the
        toggle then adjusts that one step.
      required: false
      example: '["notes", "verse", "weather"]'
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - value: notes
              label: Notes page
            - value: verse
              label: Verse of the Day
            - value: weather
              label: Morning weather
            - value: appLink
              label: Open app link
    dismiss_app_uri:
      name: Dismiss app link
      description: >-
        The phone opens this link right after the alarm is fully dismissed — a
        Shortcuts URL, for example. Send an empty string to clear it.
      required: false
      example: shortcuts://run-shortcut?name=Morning
      selector:
        text:
    snooze_app_uri:
      name: Snooze app link
      description: >-
        The phone opens this link each time the alarm is snoozed. Send an empty
        string to clear it.
      required: false
      example: shortcuts://run-shortcut?name=Five%20More
      selector:
        text:
    radio_station:
      name: Radio station
      description: >-
        Wake-up radio station. The list is the phone's favourited stations as
        it last reported them; a name or UUID can also be typed. Send an empty
        string to clear it. The name is matched ignoring case and surrounding
        spaces, so the value shown always resolves even when the station's own
        name has odd spacing in it. Requires App Persistence on the phone —
        without it the alarm rings with its tone instead. (For an arbitrary
        stream URL, publish radio_station as an object via MQTT directly.)
      required: false
      selector:
        text:
    swipe_left_command:
      name: Swipe left command
      description: >-
        Name of the command to run when swiping left on the alarm screen in the
        app. The list offers the commands this Home Assistant has seen the
        phone report; one created moments ago may not be there yet, so any name
        can still be typed.
      required: false
      example: Kitchen Lights
      selector:
        text:
    swipe_right_command:
      name: Swipe right command
      description: >-
        Name of the command to run when swiping right on the alarm screen in
        the app. The list offers the commands this Home Assistant has seen the
        phone report; one created moments ago may not be there yet, so any name
        can still be typed.
      required: false
      example: Open Door
      selector:
        text:

trigger_alert:
  name: Trigger alert
  description: >-
    Show a full-screen alert on the phone. An alert is not an alarm — there is
    no snooze, no mission and no recovery if the phone is off; it interrupts,
    plays a sound and is gone once dismissed.
  fields:
    device_name:
      name: Device
      description: Which Allarise device. Omit when only one is configured.
      required: false
      selector:
        text:
    message:
      name: Message
      description: The alert body text.
      required: true
      example: Motion detected at the front door
      selector:
        text:
          multiline: true
    title:
      name: Title
      description: Heading shown above the message. Defaults to "Security Alert".
      required: false
      example: Security Alert
      selector:
        text:
    alert_id:
      name: Alert ID
      description: >-
        A name for this KIND of alert, e.g. "front_door". Sending the same ID
        again replaces the alert already waiting on the phone instead of adding
        a second one beside it — so a sensor that fires ten times leaves one
        notification, not ten. Omit it and the alert is identified by its title
        and message instead.
      required: false
      example: front_door
      selector:
        text:
    sound:
      name: Sound
      description: >-
        Alarm tone name, exactly as it appears in the app's sound picker (for
        example Alarm_Clock or Perimeter_Breach). Ignored when a Media URL is
        set, because the media replaces the tone. The list is the phone's own
        tones as it last reported them — an older app reports none, and any
        name can still be typed.
      required: false
      example: Perimeter_Breach
      selector:
        text:
    volume:
      name: Volume
      description: >-
        Overrides the phone's system volume for this alert, as a percentage.
        Alerts play through the speaker and ignore the mute switch.
        0-100 is the scale every path uses on the wire, including
        media_player.play_media and notify.send_message, which used to disagree.
        The app still accepts a 0.0-1.0 fraction, so older automations keep
        working.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    play_sound:
      name: Play sound
      description: >-
        Whether the alert makes any sound at all. On by default, and forced off
        when a Media URL is set. Tick the field to include it in the call, then
        use the toggle to set it.
      required: false
      selector:
        boolean:
    fade_in:
      name: Fade in
      description: >-
        Ramp the alert up over this many SECONDS instead of starting at full
        volume. This is the alert's own ramp and is unrelated to an alarm's
        fade-in, which is in minutes. The app uses 5-300 seconds; 0 starts at
        full volume.
      required: false
      example: 10
      selector:
        number:
          min: 0
          max: 300
          step: 5
          unit_of_measurement: s
          mode: box
    media_url:
      name: Media URL
      description: >-
        Audio played on the alert screen, with play and repeat controls. This
        REPLACES the alert tone — setting it forces Play sound off. Accepts a
        media-source ID from the media browser or a path on this Home Assistant
        (e.g. /local/chime.mp3): those are signed automatically, so the phone
        needs no token, and the signed link expires after a while. A full
        external URL is passed through untouched.
      required: false
      example: media-source://media_source/local/chime.mp3
      selector:
        text:
    image_url:
      name: Image URL
      description: >-
        Picture shown on the alert screen — a camera snapshot, typically. A
        media-source ID or a path on this Home Assistant is signed
        automatically; a full external URL is passed through untouched. Use
        https for external images: iOS allows plain http for audio and video but
        not for images.
      required: false
      example: /api/camera_proxy/camera.front_door
      selector:
        text:
    video_url:
      name: Video URL
      description: >-
        Video played inline on the alert screen. A media-source ID or a path on
        this Home Assistant is signed automatically; a full external URL is
        passed through untouched.
      required: false
      selector:
        text:
    link_url:
      name: Link URL
      description: >-
        Adds a button that opens this link in the phone's browser. Unlike the
        media fields, this one is NOT signed and NOT made absolute — give it a
        complete URL the phone can reach on its own, including https://.
      required: false
      example: https://homeassistant.local:8123/lovelace/security
      selector:
        text:

dismiss:
  name: Dismiss alarm
  description: Dismiss the currently ringing alarm.
  fields:
    device_name:
      name: Device
      description: Which Allarise device. Omit when only one is configured.
      required: false
      selector:
        text:

snooze:
  name: Snooze alarm
  description: Snooze the currently ringing alarm.
  fields:
    device_name:
      name: Device
      description: Which Allarise device. Omit when only one is configured.
      required: false
      selector:
        text:

skip:
  name: Skip alarm
  description: Skip the next upcoming alarm.
  fields:
    device_name:
      name: Device
      description: Which Allarise device. Omit when only one is configured.
      required: false
      selector:
        text:

