update_alarm:
  name: Update Alarm
  description: Update an existing alarm on the Allarise device.
  fields:
    device_name:
      name: Device Name
      description: "The Allarise device name. Optional if only one device is configured — auto-resolved."
      required: false
      selector:
        text:
    index:
      name: Alarm Index
      description: The alarm index to update (1-based).
      required: true
      selector:
        number:
          min: 1
          max: 50
          step: 1
    time:
      name: Time
      description: "New alarm time in HH:mm format."
      selector:
        time:
    label:
      name: Label
      selector:
        text:
    enabled:
      name: Enabled
      selector:
        boolean:
    days:
      name: Days
      description: "Comma-separated days or empty for one-time."
      selector:
        text:
    sound:
      name: Sound
      selector:
        text:
    volume:
      name: Volume
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    vibrate:
      name: Vibrate
      selector:
        boolean:
    fade_in:
      name: Fade In
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: min
    snooze_limit:
      name: Snooze Limit
      selector:
        number:
          min: 0
          max: 99
          step: 1
    snooze_interval:
      name: Snooze Interval
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min
    mission:
      name: Mission
      description: >-
        Sets the alarm's first mission AND clears any others it has. To set a
        multi-mission sequence, use "Missions" instead.
      selector:
        select:
          options:
            - none
            - shake
            - math
            - balance_ball
            - block_drop
            - meteor
            - home_assistant
            - alert
    mission_config:
      name: Mission Config
      description: >-
        Extra settings for the mission above, e.g. {"math_count": 3,
        "math_difficulty": "hard"}. For a home_assistant mission this also
        carries the fallback: fallback_mission now accepts block_drop and
        meteor as well as shake/math/balance_ball/none, and every fallback
        type takes the same settings its primary form does — e.g.
        {"fallback_mission": "block_drop", "fallback_block_drop_lines": 8} or
        {"fallback_mission": "none", "fallback_tap_count": 10}. See the app's
        Inbound Commands Reference.
      selector:
        object:
    missions:
      name: Missions
      description: >-
        The alarm's full mission sequence, in order, up to 5. Each entry is
        either a type name ("math") or an object
        ({"mission": "math", "mission_config": {"math_count": 3}}). Replaces the
        whole sequence — anything beyond the 5th entry is dropped.
      selector:
        object:
    notes:
      name: Notes
      description: Replaces the after-alarm Notes page text.
      selector:
        text:
          multiline: true
    append_notes:
      name: Append Notes
      description: >-
        Adds a line to the Notes page instead of replacing it. Prefixed with
        "HA:" and separated from existing text by a divider. If the Notes page is
        on screen when this arrives, it updates live.
      selector:
        text:
          multiline: true
    alarm_screen_commands:
      name: Notes Page Commands
      description: >-
        Up to 4 command names to show as buttons on the after-alarm Notes page.
        Send an empty list to clear them.
      selector:
        object:
    morning_weather:
      name: Morning Weather
      description: Show the Good Morning weather card after this alarm is dismissed.
      selector:
        boolean:
    dismiss_app_uri:
      name: Dismiss App Link
      description: >-
        URL opened after this alarm is fully dismissed, e.g.
        shortcuts://run-shortcut?name=Morning. Send an empty string to clear.
      selector:
        text:
    snooze_app_uri:
      name: Snooze App Link
      description: URL opened when this alarm is snoozed. Empty string clears it.
      selector:
        text:
    radio_station:
      name: Radio Station
      description: >-
        Wake-up radio station. A favourited station's name or UUID. Send an
        empty string to clear it. (For an arbitrary stream URL, publish
        radio_station as an object via MQTT directly.)
      selector:
        text:
    swipe_left_command:
      name: Swipe Left Command
      description: Command name run by a left swipe on the alarm screen.
      selector:
        text:
    swipe_right_command:
      name: Swipe Right Command
      description: Command name run by a right swipe on the alarm screen.
      selector:
        text:

trigger_alert:
  name: Trigger Alert
  description: Trigger a full-screen alert on the Allarise device.
  fields:
    device_name:
      name: Device Name
      description: "The Allarise device name. Optional if only one device is configured — auto-resolved."
      required: false
      selector:
        text:
    message:
      name: Message
      description: Alert message to display.
      required: true
      selector:
        text:
    title:
      name: Title
      description: Optional alert title.
      selector:
        text:
    sound:
      name: Sound
      description: Alert sound name.
      selector:
        text:
    volume:
      name: Volume
      description: Alert volume (0-100).
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    media_url:
      name: Media URL
      description: Audio URL to play during the alert.
      selector:
        text:
    image_url:
      name: Image URL
      description: Image to display on the alert screen.
      selector:
        text:
    video_url:
      name: Video URL
      description: Video to display on the alert screen.
      selector:
        text:
    link_url:
      name: Link URL
      description: URL to open when tapping the alert.
      selector:
        text:

dismiss:
  name: Dismiss Alarm
  description: Dismiss the currently active alarm.
  fields:
    device_name:
      name: Device Name
      description: "The Allarise device name. Optional if only one device is configured — auto-resolved."
      required: false
      selector:
        text:

snooze:
  name: Snooze Alarm
  description: Snooze the currently active alarm.
  fields:
    device_name:
      name: Device Name
      description: "The Allarise device name. Optional if only one device is configured — auto-resolved."
      required: false
      selector:
        text:

skip:
  name: Skip Alarm
  description: Skip the next upcoming alarm.
  fields:
    device_name:
      name: Device Name
      description: "The Allarise device name. Optional if only one device is configured — auto-resolved."
      required: false
      selector:
        text:


create_alarm:
  name: Create alarm
  description: >-
    Create a new alarm on the phone. Only the time is required; anything omitted
    uses the phone's own defaults, exactly as if the alarm had been created by
    hand. The app assigns the MQTT alarm ID.
  fields:
    device_name:
      name: Device
      description: Which Allarise device. Omit when only one is configured.
      required: false
      selector:
        text:
    time:
      name: Time
      description: 24-hour time, HH:mm.
      required: true
      example: "07:30"
      selector:
        time:
    label:
      name: Label
      description: Alarm name shown in the app and used for the Home Assistant device name.
      required: false
      example: Weekday Wake
      selector:
        text:
    enabled:
      name: Enabled
      description: Defaults to on.
      required: false
      selector:
        boolean:
    days:
      name: Days
      description: >-
        Comma-separated weekday numbers, 1=Sunday to 7=Saturday. Omit for a
        one-time alarm.
      required: false
      example: "2,3,4,5,6"
      selector:
        text:
    sound:
      name: Sound
      description: Alarm tone ID. This is also the fallback when a radio station cannot be reached.
      required: false
      selector:
        text:
    volume:
      name: Volume
      required: false
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    vibrate:
      name: Vibrate
      required: false
      selector:
        boolean:
    fade_in:
      name: Fade in
      description: Minutes to ramp the volume over. 0 disables.
      required: false
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min
    mission:
      name: Mission
      description: Wake-up challenge that must be completed to dismiss.
      required: false
      selector:
        select:
          options:
            - none
            - shake
            - math
            - balance_ball
            - block_drop
            - meteor
            - home_assistant
            - alert
    mission_config:
      name: Mission config
      description: Per-mission settings, e.g. difficulty.
      required: false
      selector:
        object:
    missions:
      name: Missions
      description: Ordered sequence of up to 5 missions. Overrides the single Mission field.
      required: false
      selector:
        object:
    snooze_duration:
      name: Snooze interval
      required: false
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
    max_snooze_count:
      name: Snooze limit
      required: false
      selector:
        number:
          min: 0
          max: 99
    notes:
      name: Notes
      description: Text shown on the After-Alarm notes page.
      required: false
      selector:
        text:
          multiline: true
    morning_weather:
      name: Morning weather
      description: Show the weather card after this alarm is dismissed.
      required: false
      selector:
        boolean:
    radio_station:
      name: Radio station
      description: >-
        A favourited station's name or UUID. Requires App Persistence on the
        phone — without it the alarm rings with its tone instead.
      required: false
      selector:
        text:
    ephemeral:
      name: One-shot
      description: >-
        Delete the alarm after it fires. One-shot alarms get no per-alarm Home
        Assistant entities.
      required: false
      selector:
        boolean:

delete_alarm:
  name: Delete alarm
  description: >-
    Delete an alarm from the phone. Target it by MQTT alarm ID or by name —
    provide exactly one.
  fields:
    device_name:
      name: Device
      description: Which Allarise device. Omit when only one is configured.
      required: false
      selector:
        text:
    index:
      name: Alarm ID
      description: The MQTT alarm ID, as shown on the per-alarm device.
      required: false
      selector:
        number:
          min: 1
          mode: box
    name:
      name: Name
      description: Alarm label, case-insensitive. Use instead of Alarm ID.
      required: false
      example: Weekday Wake
      selector:
        text:

create_command:
  name: Create command
  description: >-
    Create or update a custom command button on the phone. Creating a command
    that already exists updates it in place.
  fields:
    device_name:
      name: Device
      description: Which Allarise device. Omit when only one is configured.
      required: false
      selector:
        text:
    name:
      name: Name
      description: Command name. Also the key used to update or delete it later.
      required: true
      example: Kitchen Lights
      selector:
        text:
    icon:
      name: Icon
      description: SF Symbol name.
      required: false
      example: lightbulb.fill
      selector:
        text:
    color_r:
      name: "Colour: red"
      required: false
      selector:
        number:
          min: 0
          max: 255
    color_g:
      name: "Colour: green"
      required: false
      selector:
        number:
          min: 0
          max: 255
    color_b:
      name: "Colour: blue"
      required: false
      selector:
        number:
          min: 0
          max: 255
    arm_action:
      name: Arm action
      description: Zone arm behaviour this command triggers.
      required: false
      selector:
        text:

delete_command:
  name: Delete command
  description: Delete a custom command button from the phone, by name.
  fields:
    device_name:
      name: Device
      description: Which Allarise device. Omit when only one is configured.
      required: false
      selector:
        text:
    name:
      name: Name
      required: true
      example: Kitchen Lights
      selector:
        text:
